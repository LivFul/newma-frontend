name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm format:check && pnpm test:coverage
      - name: Contract check against the deployed API spec
        if: vars.NEWMA_OPENAPI_URL != ''
        env:
          API_CHECK_SPEC_SOURCE: ${{ vars.NEWMA_OPENAPI_URL }}
        run: pnpm api:check
      - run: bash scripts/check-demo-isolation.sh
      - run: pnpm build
