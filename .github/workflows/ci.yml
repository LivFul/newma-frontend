name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm format:check && pnpm test:coverage
      - name: Contract check against the deployed API spec
        if: vars.NEWMA_OPENAPI_URL != ''
        env:
          API_CHECK_SPEC_SOURCE: ${{ vars.NEWMA_OPENAPI_URL }}
        run: pnpm api:check
      - run: bash scripts/check-demo-isolation.sh
      - run: pnpm build
