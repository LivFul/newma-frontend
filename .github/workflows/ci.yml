name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Unit tests and api:check read the deployed spec; the lock's sha is still enforced against it.
      API_CHECK_SPEC_SOURCE: ${{ vars.NEWMA_OPENAPI_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm format:check && pnpm claims:check && pnpm test:coverage
      - name: Contract check against the deployed API spec
        run: pnpm api:check
      - name: Canonical vectors drift check
        # Compares with the deployed API's /canonical-vectors.json. Until the repository variable
        # exists the step falls back to the lock only and emits a visible warning.
        env:
          NEWMA_VECTORS_URL: ${{ vars.NEWMA_VECTORS_URL }}
          VECTORS_ALLOW_LOCK_ONLY: ${{ vars.NEWMA_VECTORS_URL == '' && '1' || '' }}
        run: pnpm vectors:check
      - run: bash scripts/check-demo-isolation.sh
      - run: pnpm build
      - run: pnpm bundle:check
      - name: Hero JS budget (80 KiB gzip)
        run: pnpm hero:check
